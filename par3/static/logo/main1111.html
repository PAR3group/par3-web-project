
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

    :root {
        --bg-color: #ffffff;
        --par-color: #000000;
        --num3-color: #00ce7c;
    }

    /* 외부 CSS 간섭 차단 및 전체 크기 비율 제어 */
    .par3-mini-logo {
        display: inline-block !important;
        zoom: 0.45 !important; /* 원하시는 로고 크기에 따라 0.35~0.5 조절 */
        width: 580px !important;
        max-width: 580px !important;
        height: auto !important;
        transform: none !important;
        margin: 0 !important;
        padding: 0 !important;
        vertical-align: middle;
    }

    .par3-mini-logo svg {
        width: 100% !important;
        height: auto !important;
        display: block !important;
        overflow: visible;
    }
</style>

<div class="par3-mini-logo">
    <svg viewBox="0 0 580 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 1. 좌측 쇼핑백 아이콘 -->
        <g id="logo-icon">
            <g id="shopping-bag" transform="translate(82, 20)">
                <!-- 손잡이 1개 (정면 대칭 완벽한 아치 곡선) -->
                <path d="M 33 30 C 33 10, 59 10, 59 30" stroke="#000000" stroke-width="5.5" stroke-linecap="round" fill="none"/>
                
                <!-- 쇼핑백 외곽선 -->
                <path d="M 12 30 H 80 L 88 115 H 4 Z" stroke="#000000" stroke-width="6" stroke-linejoin="round" fill="none"/>
                
                <!-- 전면 초록색 시그니처 가로 라인 -->
                <line x1="22" y1="58" x2="70" y2="58" stroke="var(--num3-color)" stroke-width="4.5" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 2. 우측 PAR3 텍스트 -->
        <g id="logo-par3" transform="translate(190, 35)">
            <g fill="var(--par-color)">
                <path d="M 12 0 H 66 C 86 0 100 12 100 32 C 100 52 86 62 66 62 H 40 V 90 H 12 V 0 Z M 40 22 V 40 H 64 C 72 40 76 36 76 31 C 76 26 72 22 64 22 H 40 Z"/>
                <path d="M 128 0 L 88 90 H 118 L 125 72 H 155 L 162 90 H 192 L 152 0 H 128 Z M 132 50 L 140 28 L 148 50 H 132 Z"/>
                <path d="M 198 0 H 248 C 268 0 282 11 282 29 C 282 42 272 53 258 57 L 286 90 H 252 L 230 60 H 226 V 90 H 198 V 0 Z M 226 22 V 40 H 246 C 253 40 258 37 258 31 C 258 25 253 22 246 22 H 226 Z"/>
            </g>
            <path d="M 292 0 H 380 V 90 H 292 V 66 H 352 V 54 H 316 V 36 H 352 V 24 H 292 Z" fill="var(--num3-color)"/>
        </g>

        <!-- 3. 하단 GOLF SHOP + 녹색 라인 -->
        <g id="logo-bottom">
            <line x1="200" y1="148" x2="282" y2="148" stroke="var(--num3-color)" stroke-width="2.5" stroke-linecap="round"/>
            <text x="385" y="153" fill="var(--par-color)" font-family="'Montserrat', sans-serif" font-size="15" font-weight="900" letter-spacing="8" text-anchor="middle">GOLF SHOP</text>
            <line x1="488" y1="148" x2="570" y2="148" stroke="var(--num3-color)" stroke-width="2.5" stroke-linecap="round"/>
        </g>
    </svg>
</div>
