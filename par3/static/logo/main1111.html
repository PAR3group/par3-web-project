<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

    :root {
        --bg-color: #ffffff;
        --par-color: #000000;
        --num3-color: #00ce7c;
    }
</style>

<!-- 인라인 스타일로 외부 CSS 간섭을 완벽히 차단한 로고 박스 -->
<div
    style="display: inline-block !important; width: 200px !important; max-width: 200px !important; height: auto !important; margin: 0 !important; padding: 0 !important; transform: none !important;">
    <svg viewBox="0 0 580 180" fill="none" xmlns="http://www.w3.org/2000/svg"
        style="width: 100% !important; height: auto !important; display: block !important;">
        <!-- 1. 좌측 골프 아이콘 -->
        <g id="logo-icon">
            <!-- 초록색 궤적 라인 -->
            <path d="M 42 148 A 70 70 0 1 1 142 60" stroke="#00ce7c" stroke-width="6.5" stroke-linecap="round" />
            <path d="M 18 158 Q 100 134 182 158" stroke="#00ce7c" stroke-width="5.5" stroke-linecap="round" />

            <!-- 골프채 -->
            <g id="club">
                <!-- 샤프트: 헤드 안쪽 매립 (밑으로 삐져나오지 않음) -->
                <line x1="172" y1="5" x2="116" y2="131" stroke="#8a8a8a" stroke-width="5" stroke-linecap="butt" />

                <!-- 헤드 본체 & 넥 -->
                <path
                    d="M 118 132 L 112 144 C 110 149, 105 155, 95 155 C 83 155, 78 147, 81 139 C 84 133, 96 132, 107 136 L 114 130 Z"
                    fill="#000000" />

                <!-- 페이스 그루브 -->
                <line x1="87" y1="140" x2="108" y2="137" stroke="#bfbfbf" stroke-width="1.3" stroke-linecap="round" />
                <line x1="86" y1="143" x2="109" y2="140" stroke="#bfbfbf" stroke-width="1.3" stroke-linecap="round" />
                <line x1="87" y1="146" x2="109" y2="143" stroke="#bfbfbf" stroke-width="1.3" stroke-linecap="round" />
                <line x1="89" y1="149" x2="107" y2="146" stroke="#bfbfbf" stroke-width="1.3" stroke-linecap="round" />

                <!-- 헤드 바닥 초록색 곡선 -->
                <path d="M 84 145 C 86 152, 96 153, 104 148" stroke="#00ce7c" stroke-width="2.3"
                    stroke-linecap="round" />
            </g>

            <!-- 골프공 -->
            <g id="golf-ball">
                <circle cx="78" cy="112" r="23" fill="#000000" />
                <g fill="#555555">
                    <circle cx="68" cy="102" r="1.8" />
                    <circle cx="78" cy="100" r="1.8" />
                    <circle cx="87" cy="104" r="1.8" />
                    <circle cx="64" cy="112" r="1.8" />
                    <circle cx="74" cy="110" r="1.8" />
                    <circle cx="84" cy="113" r="1.8" />
                    <circle cx="70" cy="122" r="1.8" />
                    <circle cx="80" cy="121" r="1.8" />
                </g>
            </g>
        </g>

        <!-- 2. 우측 PAR3 텍스트 -->
        <g id="logo-par3" transform="translate(190, 35)">
            <g fill="var(--par-color)">
                <path
                    d="M 12 0 H 66 C 86 0 100 12 100 32 C 100 52 86 62 66 62 H 40 V 90 H 12 V 0 Z M 40 22 V 40 H 64 C 72 40 76 36 76 31 C 76 26 72 22 64 22 H 40 Z" />
                <path
                    d="M 128 0 L 88 90 H 118 L 125 72 H 155 L 162 90 H 192 L 152 0 H 128 Z M 132 50 L 140 28 L 148 50 H 132 Z" />
                <path
                    d="M 198 0 H 248 C 268 0 282 11 282 29 C 282 42 272 53 258 57 L 286 90 H 252 L 230 60 H 226 V 90 H 198 V 0 Z M 226 22 V 40 H 246 C 253 40 258 37 258 31 C 258 25 253 22 246 22 H 226 Z" />
            </g>
            <path d="M 292 0 H 380 V 90 H 292 V 66 H 352 V 54 H 316 V 36 H 352 V 24 H 292 Z" fill="var(--num3-color)" />
        </g>

        <!-- 3. PAR3 아래 GOLF COMMUNITY + 녹색 라인 -->
        <g id="logo-bottom">
            <line x1="200" y1="148" x2="242" y2="148" stroke="var(--num3-color)" stroke-width="2.5"
                stroke-linecap="round" />
            <text x="385" y="153" fill="var(--par-color)" font-family="'Montserrat', sans-serif" font-size="14.5"
                font-weight="900" letter-spacing="7" text-anchor="middle">GOLF COMMUNITY</text>
            <line x1="528" y1="148" x2="570" y2="148" stroke="var(--num3-color)" stroke-width="2.5"
                stroke-linecap="round" />
        </g>
    </svg>
</div>
