<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAR3 - 주문/결제</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid #1b4332; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: 800; color: #1b4332; text-decoration: none; }
        .page-title { font-size: 22px; font-weight: bold; }

        /* Grid Layout */
        .checkout-layout { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 30px; }

        /* Section Cards */
        .section-card { background: #fff; border-radius: 8px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #222; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }

        /* Form Inputs */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #666; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        .form-row { display: flex; gap: 10px; }

        /* Order Product Item */
        .order-item { display: flex; align-items: center; gap: 15px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .order-item:last-child { border-bottom: none; }
        .order-item img { width: 70px; height: 70px; object-fit: contain; border: 1px solid #eee; border-radius: 6px; }
        .item-details { flex-grow: 1; }
        .item-brand { font-size: 11px; color: #888; font-weight: bold; }
        .item-title { font-size: 14px; font-weight: bold; }
        .item-qty { font-size: 13px; color: #666; margin-top: 3px; }
        .item-price { font-weight: bold; font-size: 15px; }

        .btn-autofill { padding: 8px 14px; background: #fff; color: #1b4332; border: 1px solid #1b4332; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-autofill:hover { background-color: #e8f5e9; }
        .section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        .section-title-row .section-title { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }

        /* Payment Options */
        .pay-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .pay-btn { padding: 12px; border: 1px solid #ccc; background: #fff; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
        .pay-btn.active { border-color: #1b4332; background-color: #e8f5e9; color: #1b4332; }

        /* Summary Box */
        .summary-card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: sticky; top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 15px; color: #555; }
        .summary-row.total { font-size: 20px; font-weight: bold; color: #e63946; border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }

        .btn-pay { width: 100%; padding: 16px; background-color: #1b4332; color: #fff; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-pay:hover { background-color: #2d6a4f; }

        @media (max-width: 768px) {
            .checkout-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
