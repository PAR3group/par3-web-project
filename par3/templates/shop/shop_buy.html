<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAR3 - 주문/결제</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid #1b4332; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: 800; color: #1b4332; text-decoration: none; }
        .page-title { font-size: 22px; font-weight: bold; }

        /* Grid Layout */
        .checkout-layout { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 30px; }

        /* Section Cards */
        .section-card { background: #fff; border-radius: 8px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #222; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }

        /* Form Inputs */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #666; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        .form-row { display: flex; gap: 10px; }

        /* Order Product Item */
        .order-item { display: flex; align-items: center; gap: 15px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .order-item:last-child { border-bottom: none; }
        .order-item img { width: 70px; height: 70px; object-fit: contain; border: 1px solid #eee; border-radius: 6px; }
        .item-details { flex-grow: 1; }
        .item-brand { font-size: 11px; color: #888; font-weight: bold; }
        .item-title { font-size: 14px; font-weight: bold; }
        .item-qty { font-size: 13px; color: #666; margin-top: 3px; }
        .item-price { font-weight: bold; font-size: 15px; }

        .btn-autofill { padding: 8px 14px; background: #fff; color: #1b4332; border: 1px solid #1b4332; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-autofill:hover { background-color: #e8f5e9; }
        .section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        .section-title-row .section-title { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }

        /* Payment Options */
        .pay-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .pay-btn { padding: 12px; border: 1px solid #ccc; background: #fff; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
        .pay-btn.active { border-color: #1b4332; background-color: #e8f5e9; color: #1b4332; }

        /* Summary Box */
        .summary-card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: sticky; top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 15px; color: #555; }
        .summary-row.total { font-size: 20px; font-weight: bold; color: #e63946; border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }

        .btn-pay { width: 100%; padding: 16px; background-color: #1b4332; color: #fff; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-pay:hover { background-color: #2d6a4f; }

        @media (max-width: 768px) {
            .checkout-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
    <a href="{{ url_for('shop.main') }}" id="logoContainer" style="text-decoration: none; display: inline-block;"></a>
    <div class="page-title">주문 / 결제</div>
        </header>

        <div class="checkout-layout">
            <!-- Left: Delivery & Payment Options -->
            <div>
                <!-- Shipping Info -->
                <div class="section-card">
                    <div class="section-title-row">
                        <div class="section-title">배송지 정보</div>
                        {% if shipping_info %}
                        <button type="button" class="btn-autofill" id="btnAutofill">회원 정보로 자동입력</button>
                        {% endif %}
                    </div>
                    <div class="form-group">
                        <label>받는 사람</label>
                        <input type="text" id="recipientName" placeholder="이름을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label>연락처</label>
                        <input type="text" id="recipientPhone" placeholder="010-0000-0000">
                    </div>
                    <div class="form-group">
                        <label>주소</label>
                        <div class="form-row" style="margin-bottom: 8px;">
                            <input type="text" id="zipCode" placeholder="우편번호" style="width: 120px;">
                            <button type="button" style="padding: 0 15px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer;">주소 검색</button>
                        </div>
                        <input type="text" id="addressBase" placeholder="기본 주소" style="margin-bottom: 8px;">
                        <input type="text" id="addressDetail" placeholder="상세 주소">
                    </div>
                </div>

                <!-- Product Info Summary -->
                <div class="section-card">
                    <div class="section-title">주문 상품 정보 (<span id="orderItemCount">0</span>개)</div>
                    <div id="orderItemBox">
                        <!-- Dynamic Order Product -->
                    </div>
                </div>

                <!-- Payment Method -->
                <div class="section-card">
                    <div class="section-title">결제 수단</div>
                    <div class="pay-options">
                        <button class="pay-btn active" onclick="selectPay(this)">신용/체크카드</button>
                        <button class="pay-btn" onclick="selectPay(this)">카카오페이</button>
                        <button class="pay-btn" onclick="selectPay(this)">네이버페이</button>
                    </div>
                </div>
            </div>

            <!-- Right: Price Summary -->
            <div>
                <div class="summary-card">
                    <div class="section-title">최종 결제 금액</div>
                    <div class="summary-row">
                        <span>총 상품 금액</span>
                        <span id="buySubTotal">0 원</span>
                    </div>
                    <div class="summary-row">
                        <span>배송비</span>
                        <span id="buyShipping">3,000 원</span>
                    </div>
                    <div class="summary-row total">
                        <span>총 결제금액</span>
                        <span id="buyGrandTotal">0 원</span>
                    </div>
                    <button class="btn-pay" id="btnSubmitPay">결제하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const orderItems = {{ order_items|tojson }};
        const shippingInfo = {{ shipping_info|tojson }};

        if (!orderItems || orderItems.length === 0) {
            alert('주문할 상품 정보를 찾을 수 없습니다.');
            window.location.href = "{{ url_for('shop.main') }}";
        }

        const itemTotal = orderItems.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const shipping = itemTotal > 0 ? (itemTotal >= 200000 ? 0 : 3000) : 0;
        const grandTotal = itemTotal + shipping;

        // 상품 표시 (여러 개인 경우 각각 한 줄씩)
        document.getElementById('orderItemCount').innerText = orderItems.length;
        document.getElementById('orderItemBox').innerHTML = orderItems.map(item => `
            <div class="order-item">
                <img src="${item.mainImg}" alt="${item.title}">
                <div class="item-details">
                    <div class="item-brand">${item.brand}</div>
                    <div class="item-title">${item.title}</div>
                    <div class="item-qty">수량: ${item.quantity}개</div>
                </div>
                <div class="item-price">${(item.price * item.quantity).toLocaleString()} 원</div>
            </div>
        `).join('');

        // 금액 표시
        document.getElementById('buySubTotal').innerText = itemTotal.toLocaleString() + ' 원';
        document.getElementById('buyShipping').innerText = shipping === 0 ? '무료배송' : shipping.toLocaleString() + ' 원';
        document.getElementById('buyGrandTotal').innerText = grandTotal.toLocaleString() + ' 원';

        // 회원 정보로 배송지 자동입력
        const btnAutofill = document.getElementById('btnAutofill');
        if (btnAutofill && shippingInfo) {
            btnAutofill.addEventListener('click', () => {
                document.getElementById('recipientName').value = shippingInfo.name || '';
                document.getElementById('recipientPhone').value = shippingInfo.phone || '';
                document.getElementById('addressBase').value = shippingInfo.address || '';
            });
        }

        // 결제 버튼 선택
        function selectPay(element) {
            document.querySelectorAll('.pay-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // 결제완료 처리 - 장바구니에서 넘어온 주문이면 결제 완료 후 담았던 항목을 비운다
        document.getElementById('btnSubmitPay').addEventListener('click', async () => {
            const cartItemIds = orderItems.map(item => item.cartItemId).filter(Boolean);
            await Promise.all(cartItemIds.map(cartItemId =>
                fetch('/shop/cart/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart_item_id: cartItemId })
                })
            ));

            alert(`${grandTotal.toLocaleString()}원 결제가 완료되었습니다. 주문해 주셔서 감사합니다!`);
            window.location.href = "{{ url_for('shop.main') }}";
        });

        // ★ 로고 파일(main1111.html) 불러와서 삽입 ★
        fetch('/static/logo/main1111.html')
            .then(response => response.text())
            .then(data => {
                const logoContainer = document.getElementById('logoContainer');
                if (logoContainer) logoContainer.innerHTML = data;
            })
            .catch(error => console.error('로고 로드 오류:', error));
    </script>
</body>
</html>
