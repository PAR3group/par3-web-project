<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAR3 - 장바구니</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        /* Header */
        .shop-logo-link {
            display: inline-block;
            text-decoration: none;
        }

        .shop-logo-img {
            width: 250px;
            height: auto;
            display: block;
            mix-blend-mode: multiply;
            opacity: 0.99;
        }

        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid #1b4332; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: 800; color: #1b4332; text-decoration: none; }
        .page-title { font-size: 22px; font-weight: bold; }

        /* Cart Layout */
        .cart-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }

        /* Table */
        .cart-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .cart-table th { background: #fafafa; padding: 15px; font-size: 14px; color: #666; border-bottom: 1px solid #eee; text-align: left; }
        .cart-table td { padding: 20px 15px; border-bottom: 1px solid #eee; vertical-align: middle; }

        .product-info { display: flex; align-items: center; gap: 15px; }
        .product-info img { width: 80px; height: 80px; object-fit: contain; border: 1px solid #eee; border-radius: 6px; padding: 5px; }
        .product-brand { font-size: 12px; color: #888; font-weight: bold; }
        .product-name { font-size: 15px; font-weight: bold; margin-top: 2px; }

        .qty-box { display: flex; align-items: center; border: 1px solid #ccc; border-radius: 4px; width: fit-content; }
        .qty-box button { width: 28px; height: 28px; background: #fff; border: none; cursor: pointer; font-size: 14px; }
        .qty-box input { width: 35px; text-align: center; border: none; font-size: 14px; font-weight: bold; }

        .price { font-weight: bold; font-size: 16px; }
        .btn-delete { background: none; border: none; color: #999; cursor: pointer; font-size: 18px; }
        .btn-delete:hover { color: #e63946; }

        .empty-cart { text-align: center; padding: 60px 0; color: #888; }

        /* Order Summary Box */
        .summary-card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); height: fit-content; position: sticky; top: 20px; }
        .summary-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 15px; color: #555; }
        .summary-row.total { font-size: 18px; font-weight: bold; color: #1b4332; border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }

        .btn-checkout { width: 100%; padding: 15px; background-color: #1b4332; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-checkout:hover { background-color: #2d6a4f; }
        .btn-checkout:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-continue { width: 100%; padding: 12px; background: #fff; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-top: 8px; cursor: pointer; text-align: center; text-decoration: none; display: block; color: #333; }

        .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; background: #fff; border: 1px solid #ccc; border-radius: 999px; color: #333; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 20px; transition: background-color 0.2s, border-color 0.2s, color 0.2s; }
        .btn-back:hover { background-color: #1b4332; border-color: #1b4332; color: #fff; }

        @media (max-width: 768px) {
            .cart-layout { grid-template-columns: 1fr; }
        }

        /* 좌우 세로 브랜드 텍스트 */
        .side-brand-text { position: absolute; top: 50vh; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5; }
        .side-brand-text .side-brand-line { width: 2px; height: 40px; background-color: #00ce7c; flex-shrink: 0; }
        .side-brand-text .side-brand-label { writing-mode: vertical-rl; white-space: nowrap; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #999; }
        .side-brand-text--left { left: 20px; }
        .side-brand-text--right { right: 20px; }
        @media (max-width: 1300px) { .side-brand-text { display: none; } }
    </style>
</head>
<body>
    <div class="side-brand-text side-brand-text--left">
        <span class="side-brand-line"></span>
        <span class="side-brand-label">GOLF SHOP</span>
        <span class="side-brand-line"></span>
    </div>
    <div class="side-brand-text side-brand-text--right">
        <span class="side-brand-line"></span>
        <span class="side-brand-label">GOLF SHOP</span>
        <span class="side-brand-line"></span>
    </div>

    <div class="container">
        <header>
    <a href="{{ url_for('shop.main') }}" class="shop-logo-link">
        <img src="{{ url_for('static', filename='logo/shop_logo.png') }}"
            alt="PAR3 SHOP"
            class="shop-logo-img">
    </a>
    <div class="page-title">장바구니</div>
        </header>

        <button type="button" class="btn-back" onclick="history.back()">&lsaquo; 뒤로가기</button>

        <div class="cart-layout">
            <!-- Left: Item List -->
            <div>
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>상품정보</th>
                            <th>수량</th>
                            <th>주문금액</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartList">
                        {% for item in cart_items %}
                        <tr data-cart-item-id="{{ item.cartItemId }}" data-price="{{ item.price }}" data-qty="{{ item.quantity }}">
                            <td>
                                <div class="product-info">
                                    <img src="{{ item.mainImg }}" alt="{{ item.title }}">
                                    <div>
                                        <div class="product-brand">{{ item.brand }}</div>
                                        <div class="product-name">{{ item.title }}</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="qty-box">
                                    <button class="btn-qty-minus" type="button">-</button>
                                    <input type="text" class="qty-input" value="{{ item.quantity }}" readonly>
                                    <button class="btn-qty-plus" type="button">+</button>
                                </div>
                            </td>
                            <td class="price item-total">{{ '{:,}'.format(item.price * item.quantity) }} 원</td>
                            <td><button class="btn-delete" type="button">✕</button></td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="empty-cart">장바구니가 비어 있습니다.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <!-- Right: Price Summary -->
            <div class="summary-card">
                <div class="summary-title">결제 예정 금액</div>
                <div class="summary-row">
                    <span>상품금액</span>
                    <span id="subTotal">0 원</span>
                </div>
                <div class="summary-row">
                    <span>배송비</span>
                    <span id="shippingFee">3,000 원</span>
                </div>
                <div class="summary-row total">
                    <span>총 결제금액</span>
                    <span id="grandTotal">0 원</span>
                </div>
                <button class="btn-checkout" id="btnOrder">주문하기</button>
                <a href="{{ url_for('shop.main') }}" class="btn-continue">쇼핑 계속하기</a>
            </div>
        </div>
    </div>

    <script>
        const cartList = document.getElementById('cartList');

        function currentRows() {
            return Array.from(cartList.querySelectorAll('tr[data-cart-item-id]'));
        }

        function recalcTotals() {
            const rows = currentRows();
            const itemTotal = rows.reduce((sum, row) => sum + Number(row.dataset.price) * Number(row.dataset.qty), 0);
            const shipping = itemTotal > 0 ? (itemTotal >= 200000 ? 0 : 3000) : 0;
            const total = itemTotal + shipping;

            document.getElementById('subTotal').innerText = itemTotal.toLocaleString() + ' 원';
            document.getElementById('shippingFee').innerText = shipping === 0 ? '무료배송' : shipping.toLocaleString() + ' 원';
            document.getElementById('grandTotal').innerText = total.toLocaleString() + ' 원';

            document.getElementById('btnOrder').disabled = rows.length === 0;

            if (rows.length === 0) {
                cartList.innerHTML = `<tr><td colspan="4" class="empty-cart">장바구니가 비어 있습니다.</td></tr>`;
            }
        }

        async function updateQuantity(row, quantity) {
            const cartItemId = row.dataset.cartItemId;
            const res = await fetch('/shop/cart/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cart_item_id: Number(cartItemId), quantity })
            });
            if (res.status === 401) {
                window.location.href = `/auth/login?next=${encodeURIComponent(location.pathname)}`;
                return;
            }
            const data = await res.json();
            if (!data.success) return;

            if (quantity < 1) {
                row.remove();
            } else {
                row.dataset.qty = quantity;
                row.querySelector('.qty-input').value = quantity;
                row.querySelector('.item-total').innerText = (Number(row.dataset.price) * quantity).toLocaleString() + ' 원';
            }
            recalcTotals();
        }

        async function removeItem(row) {
            const cartItemId = row.dataset.cartItemId;
            const res = await fetch('/shop/cart/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cart_item_id: Number(cartItemId) })
            });
            if (res.status === 401) {
                window.location.href = `/auth/login?next=${encodeURIComponent(location.pathname)}`;
                return;
            }
            const data = await res.json();
            if (data.success) {
                row.remove();
                recalcTotals();
            }
        }

        cartList.addEventListener('click', (e) => {
            const row = e.target.closest('tr[data-cart-item-id]');
            if (!row) return;

            if (e.target.classList.contains('btn-qty-plus')) {
                updateQuantity(row, Number(row.dataset.qty) + 1);
            } else if (e.target.classList.contains('btn-qty-minus')) {
                if (Number(row.dataset.qty) - 1 < 1) return;
                updateQuantity(row, Number(row.dataset.qty) - 1);
            } else if (e.target.classList.contains('btn-delete')) {
                if (confirm('상품을 장바구니에서 삭제하시겠습니까?')) {
                    removeItem(row);
                }
            }
        });

        document.getElementById('btnOrder').addEventListener('click', () => {
            if (currentRows().length === 0) return;
            window.location.href = '/shop/buy';
        });

        recalcTotals();

        // ★ 로고 파일(shop_logo.html) 불러와서 삽입 ★
        // fetch('/static/logo/shop_logo.html')
        //     .then(response => response.text())
        //     .then(data => {
        //         const logoContainer = document.getElementById('logoContainer');
        //         if (logoContainer) logoContainer.innerHTML = data;
        //     })
        //     .catch(error => console.error('로고 로드 오류:', error));
    </script>
    <script src="{{ url_for('static', filename='js/side_brand.js') }}"></script>
</body>
</html>
