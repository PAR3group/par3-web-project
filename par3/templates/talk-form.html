{% extends 'base.html' %}

{% block extra_css %}
<!-- Flask 정적 파일 경로로 수정 -->
<link rel="stylesheet" href="{{ url_for('static', filename='talk-form.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="main-wrapper">
        <div class="write-header">
            <h2>✏️ PAR3 TALK</h2>
            <p>골프 관련 다양한 이야기와 후기를 남겨주세요.</p>
        </div>

        <!-- 🌟 Flask 폼 전송 경로 수정 -->
        <form action="{{ url_for('talk_write') }}" method="POST" enctype="multipart/form-data" class="write-form">
            <!-- 1) 카테고리 -->
            <div class="form-group">
                <label for="category">카테고리</label>
                <select name="category" id="category" required>
                    <option value="" disabled selected>카테고리를 선택하세요</option>
                    <option value="필드후기">필드후기</option>
                    <option value="장비추천">장비추천</option>
                    <option value="골프팁">골프팁</option>
                    <option value="자유톡">자유톡</option>
                </select>
            </div>

            <div class="form-group">
                <label for="author">작성자</label>
                <input type="text" id="author" name="author" placeholder="닉네임을 입력하세요 (미입력 시 '골프인')">
            </div>

            <!-- 2) 제목 -->
            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" placeholder="제목을 입력하세요" required>
            </div>

            <!-- 3) 사진 / 동영상 첨부 -->
            <div class="form-group">
                <label for="media">사진 / 동영상 첨부</label>
                <input type="file" id="media" name="media" accept="image/*, video/*" multiple>
                <p class="file-hint">* 이미지 또는 동영상 파일을 첨부할 수 있습니다. (여러 개 선택 가능)</p>
            </div>

            <!-- 4) 내용 -->
            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content" name="content" rows="10" placeholder="내용을 자유롭게 작성해 주세요." required></textarea>
            </div>

            <!-- 5) 버튼 영역 -->
            <div class="form-actions">
                <!-- 🌟 취소 버튼 경로 수정 -->
                <a href="{{ url_for('talk_list') }}" class="btn-cancel">취소</a>
                <button type="submit" class="btn-submit">등록하기</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
