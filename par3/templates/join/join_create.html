{% extends 'base.html' %}

{% block title %}
PAR3 - JOIN CREATE
{% endblock %}

{% block content %}
<div class="p_join_create">

  <!-- jc_head : 페이지 타이틀 영역 (join.html의 j_head와 동일 톤) -->
  <div class="jc_head">
    <h1 class="jc_title">⛳Join Create </h1>
    <p class="jc_subtitle">라운딩 멤버를 모집해보세요.</p>
  </div>

  <!-- g_form : 공통 폼 wrapper, join_apply.html과 동일 컴포넌트 재사용 -->
  <form class="g_form" action="/join/create" method="POST">

    <!-- ===== 섹션 1. 기본 라운드 정보 영역 ===== -->
    <div class="g_form_section">
      <div class="g_form_section_title">1. 기본 라운드 정보</div>

      <div class="g_form_row">
        <label class="g_form_label">골프장 선택</label>
        <div class="g_form_input jc_course_row">

          <!-- 지역 드롭다운 -->
          <div class="jc_region_select" id="jc_region_select">
            <button type="button" class="jc_region_bt">
              <span class="jc_region_bt_text">지역</span>
              <span class="jc_region_icon"></span>
            </button>
            <div class="jc_region_panel">
              <label class="jc_region_option"><input type="radio" name="region_radio" value="서울"> 서울</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="경기"> 경기</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="인천"> 인천</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="강원도"> 강원도</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="대전"> 대전</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="대구"> 대구</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="부산"> 부산</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="광주"> 광주</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="울산"> 울산</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="세종"> 세종</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="충청북도"> 충청북도</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="충청남도"> 충청남도</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="경상북도"> 경상북도</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="경상남도"> 경상남도</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="전라북도"> 전라북도</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="전라남도"> 전라남도</label>
              <label class="jc_region_option"><input type="radio" name="region_radio" value="제주도"> 제주도</label>
            </div>
          </div>

          <!-- 골프장 검색 + 드롭다운 (타이핑 검색 / 지역 선택 시 목록 자동 표시 둘 다 지원) -->
          <div class="jc_course_search_wrap">
            <input type="text" class="g_form_input--text" id="jc_course_search_input"
              placeholder="골프장 이름을 검색하거나, 지역을 선택하면 목록이 나와요" autocomplete="off">
            <div class="jc_course_panel" id="jc_course_panel">
              <!-- 검색/필터링 결과 목록이 여기 채워짐 (JS) -->
            </div>
          </div>

          <!-- 실제 제출되는 값들 -->
          <input type="hidden" name="course_name" id="jc_course_name_hidden">
          <input type="hidden" name="region" id="jc_region_hidden">
          <input type="hidden" name="thumb_img_url" id="jc_thumb_img_hidden">
        </div>
      </div>

      <div class="g_form_row">
        <label class="g_form_label">라운드 날짜</label>
        <div class="g_form_input">
          <div class="jc_date_wrap">
            <span class="jc_date_icon"></span>
            <input type="text" class="g_form_input--date" id="round_date_picker" name="round_date"
              placeholder="2026-08-09" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="g_form_row jc_two_field_row">

        <div class="jc_field_half">
          <label class="g_form_label">티오프 시간</label>
          <div class="g_form_input">
            <div class="jc_time_wrap">
              <span class="jc_time_icon"></span>
              <input type="text" class="g_form_input--time" id="tee_time_picker" name="tee_time" placeholder="11:30"
                autocomplete="off">
            </div>
          </div>
        </div>

        <div class="jc_field_half">
          <label class="g_form_label">코스 이름</label>
          <div class="g_form_input">
            <input type="text" class="g_form_input--text" name="course_info" placeholder="코스 이름">
          </div>
        </div>

      </div>

      <!-- ===== 섹션 2. 비용 및 인원 조건 영역 ===== -->
      <div class="g_form_section">
        <div class="g_form_section_title">2. 비용 및 인원 조건</div>

        <div class="g_form_row">
          <label class="g_form_label">그린피/캐디피</label>
          <div class="g_form_input">
            <input type="text" class="g_form_input--text" name="cost" placeholder="1인 기준 비용">
          </div>
        </div>

        <div class="g_form_row">
          <label class="g_form_label">모집 인원</label>
          <div class="g_form_input g_form_input--radio">
            <label><input type="radio" name="recruit_count" value="4"> 4인 필수</label>
            <label><input type="radio" name="recruit_count" value="3"> 3인 1팀</label>
            <label><input type="radio" name="recruit_count" value="direct"> 직접 입력</label>
          </div>
        </div>

        <div class="g_form_row">
          <label class="g_form_label">성별 조건</label>
          <div class="g_form_input g_form_input--radio">
            <label><input type="radio" name="gender_condition" value="무관" checked> 무관</label>
            <label><input type="radio" name="gender_condition" value="남성만"> 남성만</label>
            <label><input type="radio" name="gender_condition" value="여성만"> 여성만</label>
            <label><input type="radio" name="gender_condition" value="부부"> 부부</label>
          </div>
        </div>
      </div>

      <!-- ===== 섹션 3. 상세 내용 및 소통 영역 ===== -->
      <div class="g_form_section">
        <div class="g_form_section_title">3. 상세 내용 및 소통</div>

        <div class="g_form_row">
          <label class="g_form_label">제목</label>
          <div class="g_form_input">
            <input type="text" class="g_form_input--text" name="title" placeholder="예: 8월 30일 마이다스CC 실크코스 조인 하실 분 구합니다">
          </div>
        </div>

        <div class="g_form_row">
          <label class="g_form_label">상세 내용</label>
          <div class="g_form_input">
            <textarea class="g_form_input--textarea" name="content"
              placeholder="매너 좋은 동반자 환영합니다. 실력은 크게 상관없으니 편하게 신청 주세요! (플레이 성향, 카트비/캐디피 분할방식 등 추가 안내 사항 작성 공간)"></textarea>
          </div>
        </div>
      </div>

      <!-- jc_submit_bt : CREATE 버튼, join.html의 jt_join_bt와 동일 톤 -->
      <button type="submit" class="jc_submit_bt">CREATE</button>

  </form>

</div>
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/join_create.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
{% endblock %}

{% block js %}
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="{{ url_for('static', filename='js/join_create.js') }}"></script>
{% endblock %}
