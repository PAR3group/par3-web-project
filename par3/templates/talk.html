{% extends 'base.html' %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/talk.css') }}?v=1.0">
<link rel="stylesheet" href="{{url_for('static', filename='css/side_news.css')}}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="main-wrapper">
        <div class="talk-sticky-header">
            <div class="talk-header">
                <h2>💬 TALK</h2>
                <p>자유로운 노하우와 이야기를 나누는 공간</p>
            </div>
        </div>
        <section class="talk_main_container">
            <div class="action-bar">

                <div class="j_dropdown" id="j_dropdown_talk_category">
                    <button type="button" class="j_dropdown_bt">
                        카테고리<span class="j_filter_select_icon"></span>
                    </button>
                    <div class="j_dropdown_panel">
                        <label class="j_dropdown_option">
                            <input type="checkbox" class="j_dropdown_checkbox" value="필드후기" {% if '필드후기' in current_categories %}checked{% endif %}>
                            필드후기
                        </label>
                        <label class="j_dropdown_option">
                            <input type="checkbox" class="j_dropdown_checkbox" value="장비추천" {% if '장비추천' in current_categories %}checked{% endif %}>
                            장비추천
                        </label>
                        <label class="j_dropdown_option">
                            <input type="checkbox" class="j_dropdown_checkbox" value="골프팁" {% if '골프팁' in current_categories %}checked{% endif %}>
                            골프팁
                        </label>
                        <label class="j_dropdown_option">
                            <input type="checkbox" class="j_dropdown_checkbox" value="자유톡" {% if '자유톡' in current_categories %}checked{% endif %}>
                            자유톡
                        </label>
                    </div>
                </div>

                <span class="j_filter_bar_divider"></span>

                <form action="{{ url_for('talk.list') }}" method="GET" class="j_filter_search_wrap"
                    onsubmit="return checkSearch(this)">
                    {% if current_sort and current_sort != 'latest' %}<input type="hidden" name="sort" value="{{ current_sort }}">{% endif %}
                    {% for cat in current_categories %}<input type="hidden" name="category" value="{{ cat }}">{% endfor %}
                    <button type="submit" class="j_filter_search_icon" aria-label="검색"></button>
                    <input type="text" class="j_filter_search" placeholder="검색어를 입력하세요" name="keyword"
                        value="{{ request.args.get('keyword', '') }}" autocomplete="off">
                </form>

                <a href="{{ url_for('talk.write') }}" class="jt_write_bt">+ 글쓰기</a>

            </div>

            <div id="talk_results">
                {% include 'talk_results.html' %}
            </div>
        </section>
        <div class="up_icon"><img src="{{ url_for('static', filename='icon/up_icon.png') }}" alt="최상단으로 가기"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/talk.js') }}"></script>

{% endblock %}
